<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Infinity Bank - Simulador</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .cartao {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }

        h2 {
            color: #d97706;
            text-align: center;
            margin-bottom: 20px;
        }

        .grupo-input {
            margin-bottom: 15px;
        }

        .grupo-input label {
            display: block;
            font-weight: bold;
            color: #495057;
            margin-bottom: 5px;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        input:focus,
        select:focus {
            border-color: #d97706;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background-color: #d97706;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #b45309;
        }

        #resultado {
            margin-top: 20px;
            padding: 20px;
            background-color: #fffbeb;
            border: 1px solid #fde68a;
            border-radius: 8px;
            color: #92400e;
            display: none;
            line-height: 1.6;
        }

        .destaque {
            font-weight: bold;
            color: #b45309;
            font-size: 1.1em;
        }
    </style>
</head>

<body>

    <div class="cartao">
        <h2>Simulador Infinity Bank</h2>

        <div class="grupo-input">
            <label>Valor da Venda (R$)</label>
            <input type="number" id="valorVenda" step="0.01" min="0" placeholder="Ex: 1500.00">
        </div>

        <div class="grupo-input">
            <label>Bandeira do Cartão</label>
            <select id="bandeira">
                <option value="visa">Visa (2%)</option>
                <option value="master">Mastercard (1.85%)</option>
                <option value="elo">Elo (3%)</option>
            </select>
        </div>

        <div class="grupo-input">
            <label>Número de Parcelas</label>
            <input type="number" id="parcelas" min="1" max="24" value="1">
        </div>

        <button id="btnSimular">Simular Venda</button>

        <div id="resultado"></div>
    </div>
    <script src="script.js"></script>
</body>

</html>

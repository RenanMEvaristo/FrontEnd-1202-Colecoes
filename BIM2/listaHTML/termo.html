<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Termo Clone - React</title>
    <!-- Bibliotecas do React via CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel para traduzir JSX no navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body { font-family: sans-serif; background-color: #6e5c62; color: white; margin: 0; }
        .jogo-container { display: flex; flex-direction: column; align-items: center; padding-top: 30px; }
        .grade { display: grid; gap: 8px; }
        .linha { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
        .quadrado {
            width: 55px; height: 55px; border: 3px solid #4c4347;
            display: flex; justify-content: center; align-items: center;
            font-size: 2rem; font-weight: bold; text-transform: uppercase;
            border-radius: 4px;
        }
        /* Cores oficiais do Termo */
        .correta { background-color: #3aa394; border-color: #3aa394; }
        .lugar-errado { background-color: #d3ad69; border-color: #d3ad69; }
        .errada { background-color: #312a2c; border-color: #312a2c; }
        h1 { margin-bottom: 20px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        button { margin-top: 20px; padding: 10px 20px; font-size: 1rem; cursor: pointer; border-radius: 5px; border: none; background: white; color: #333; font-weight: bold; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const PALAVRA_CORRETA = "REACT";

        function App() {
            const [tentativas, setTentativas] = useState(Array(6).fill(""));
            const [tentativaAtual, setTentativaAtual] = useState(0);
            const [digitando, setDigitando] = useState("");
            const [venceu, setVenceu] = useState(false);

            useEffect(() => {
                function handleKeyDown(e) {
                    if (venceu || tentativaAtual >= 6) return;

                    if (e.key === "Enter") {
                        if (digitando.length === 5) conferirTentativa();
                    } else if (e.key === "Backspace") {
                        setDigitando(prev => prev.slice(0, -1));
                    } else if (digitando.length < 5 && e.key.match(/^[a-z]$/i)) {
                        setDigitando(prev => (prev + e.key).toUpperCase());
                    }
                }

                window.addEventListener("keydown", handleKeyDown);
                return () => window.removeEventListener("keydown", handleKeyDown);
            }, [digitando, venceu, tentativaAtual]);

            function conferirTentativa() {
                const novasTentativas = [...tentativas];
                novasTentativas[tentativaAtual] = digitando;
                setTentativas(novasTentativas);

                if (digitando === PALAVRA_CORRETA) {
                    setVenceu(true);
                } else if (tentativaAtual === 5) {
                    setTimeout(() => alert("Fim de jogo! A palavra era " + PALAVRA_CORRETA), 100);
                }

                setTentativaAtual(prev => prev + 1);
                setDigitando("");
            }

            return (
                <div className="jogo-container">
                    <h1>TERMO CLONE 🧩</h1>
                    <div className="grade">
                        {tentativas.map((palavra, i) => (
                            <div key={i} className="linha">
                                {(i === tentativaAtual ? digitando.padEnd(5, " ") : palavra.padEnd(5, " "))
                                    .split("").map((letra, j) => {
                                        let cor = "";
                                        if (i < tentativaAtual) {
                                            if (letra === PALAVRA_CORRETA[j]) cor = "correta";
                                            else if (PALAVRA_CORRETA.includes(letra)) cor = "lugar-errado";
                                            else cor = "errada";
                                        }
                                        return <div key={j} className={`quadrado ${cor}`}>{letra !== " " ? letra : ""}</div>
                                    })
                                }
                            </div>
                        ))}
                    </div>
                    {venceu && <h2>VOCÊ VENCEU! 🎉</h2>}
                    {(venceu || tentativaAtual >= 6) && <button onClick={() => window.location.reload()}>Novo Jogo</button>}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Conversor de Temperatura</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #e9ecef;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .cartao {
            background-color: #ffffff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 100%;
            max-width: 400px;
        }

        .cartao h2 {
            color: #343a40;
            margin-bottom: 25px;
        }

        .grupo-input {
            text-align: left;
            margin-bottom: 20px;
        }

        .grupo-input label {
            display: block;
            font-weight: bold;
            color: #495057;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ced4da;
            border-radius: 6px;
            font-size: 18px;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: #ff8c00;
        }

        .setas {
            font-size: 24px;
            color: #adb5bd;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

    <div class="cartao">
        <h2>Conversor Dinâmico</h2>

        <div class="grupo-input">
            <label>Graus Celsius (°C)</label>
            <input type="number" id="inputCelsius" step="0.1" placeholder="Ex: 25" oninput="converterParaFahrenheit()">
        </div>

        <div class="setas">⇅</div>

        <div class="grupo-input">
            <label>Graus Fahrenheit (°F)</label>
            <input type="number" id="inputFahrenheit" step="0.1" placeholder="Ex: 77" oninput="converterParaCelsius()">
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>

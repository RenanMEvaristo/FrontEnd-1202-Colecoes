<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Infinity Bank - Eventos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .cartao {
            background-color: #ffffff;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 450px;
        }

        h2 {
            color: #334155;
            text-align: center;
            margin-bottom: 25px;
        }

        .grupo-input {
            margin-bottom: 20px;
        }

        .grupo-input label {
            display: block;
            font-weight: bold;
            color: #475569;
            margin-bottom: 8px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        input:focus,
        select:focus {
            border-color: #8b5cf6;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            background-color: #8b5cf6;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #7c3aed;
        }

        #resultado {
            margin-top: 25px;
            padding: 20px;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            color: #334155;
            display: none;
        }

        .linha-resultado {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 15px;
        }

        .linha-total {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px dashed #cbd5e1;
            font-size: 18px;
            font-weight: bold;
            color: #8b5cf6;
        }

        .texto-desconto {
            color: #10b981;
        }
    </style>
</head>

<body>

    <div class="cartao">
        <h2>Orçamento de Eventos</h2>

        <div class="grupo-input">
            <label>Escolha o Pacote</label>
            <select id="pacote">
                <option value="50">Standard (R$ 50,00 por pessoa)</option>
                <option value="80">Premium (R$ 80,00 por pessoa)</option>
                <option value="120">Infinity Deluxe (R$ 120,00 por pessoa)</option>
            </select>
        </div>

        <div class="grupo-input">
            <label>Quantidade de Pessoas</label>
            <input type="number" id="pessoas" min="1" placeholder="Ex: 150">
        </div>

        <button id="btnCalcular">Calcular Orçamento</button>

        <div id="resultado"></div>
    </div>
    <script src="script.js"></script>
</body>

</html>
